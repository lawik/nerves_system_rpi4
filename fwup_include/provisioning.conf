# Support setting device serial numbers when creating MicroSD cards.
# Note that the '$' is escaped so that environment variable replacement
# happens at "burn" time rather than at firmware creation time. No
# serial numbers are stored in the .fw file. If left blank, the device
# will default to a built-in ID.
uboot_setenv(uboot-env, "nerves_serial_number", "\${NERVES_SERIAL_NUMBER}")

# usbproxy: provision per-device settings at burn time from environment
# variables, so a fleet can run one firmware. Empty when unset; the
# firmware falls back to sensible defaults (or, for the auth key, to
# /data/tailscale/authkey).
uboot_setenv(uboot-env, "tailscale_authkey", "\${TAILSCALE_AUTHKEY}")
uboot_setenv(uboot-env, "tailscale_hostname", "\${TAILSCALE_HOSTNAME}")
uboot_setenv(uboot-env, "power_cyclable_hubs", "\${POWER_CYCLABLE_HUBS}")
